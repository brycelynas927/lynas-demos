const durationItems=[15,20,30,60];
const challenges=[
{cat:'business',icon:'💻',name:'Spot an opportunity',steps:['Write down three annoyances you encounter at electrical jobs.','Circle one problem other crews probably experience.','Describe a simple online solution in two sentences.']},
{cat:'business',icon:'🎯',name:'Find your first customer problem',steps:['Think of one type of small business you understand.','Write five questions you could ask an owner about their workflow.','Pick one person to ask this week—without pitching a product.']},
{cat:'business',icon:'🧩',name:'Study a tiny online business',steps:['Find one software tool or digital product sold to contractors.','Note who it helps and what it charges.','Write down what you would do differently.']},
{cat:'business',icon:'🚀',name:'Create a micro offer',steps:['Choose one problem you might solve for a customer.','Write what you could deliver in a week.','Set a hypothetical pilot price and what is included.']},
{cat:'business',icon:'🔎',name:'Validate an idea',steps:['Write down a business problem you think is worth solving.','Find two existing solutions people currently use.','List the evidence you would need before building anything.']},
{cat:'skills',icon:'🤖',name:'Try an AI workflow',steps:['Pick a repetitive task from a trade business.','Describe its inputs, steps, and desired output.','Sketch how an AI or no-code workflow could reduce manual work.']},

{cat:'skills',icon:'📣',name:'Test your marketing brain',steps:['Choose a pretend local business.','Write a helpful social post solving a customer question.','Make the post clear, useful, and not pushy.']},
{cat:'skills',icon:'⌨️',name:'Learn one web concept',steps:['Explore the difference between HTML, CSS, and JavaScript.','Look at one example of each.','Write down which part interests you most.']},
{cat:'skills',icon:'📊',name:'Think like a product builder',steps:['Open an app you use daily.','Find one part that feels confusing or takes too many taps.','Sketch a faster version and explain why it is better.']},
{cat:'spanish',icon:'🇪🇸',name:'Speak a little Spanish',steps:['Open your Spanish lesson and study five new words.','Say each word aloud three times.','Use two of them in a simple sentence.']},
{cat:'spanish',icon:'🗣️',name:'Practice a travel conversation',steps:['Practice Hola, buenos días, and gracias.','Say: Me gustaría un café, por favor.','Imagine ordering at a café in Spain and repeat your lines.']},
{cat:'growth',icon:'🌱',name:'Future-you reflection',steps:['Write down one thing you wish were different a year from now.','Break it into one achievable action for this week.','Note what might get in the way and how to make it easier.']},
{cat:'growth',icon:'✨',name:'Create a tiny reset',steps:['Tidy one small area for five minutes.','Write down the three things on your mind.','Pick one nice thing you can do for yourself tonight.']},
{cat:'growth',icon:'📓',name:'Discover what energizes you',steps:['Write about three activities you enjoy.','For each one, note what you like about it.','Circle an activity or skill you want to explore more.']},
{cat:'money',icon:'💸',name:'Plan a future freedom fund',steps:['Write down one realistic future travel goal.','Estimate what you would want saved before leaving.','Choose a tiny next step, even if it is just research.']},
{cat:'money',icon:'🧭',name:'Define your freedom number',steps:['Write your approximate essential monthly expenses.','Add a buffer for taxes, business costs, and uncertainty.','Label your estimate as a starting target to refine later.']},

function challengeMarkup(){let {item,key}=chooseChallenge(),done=!!state.completions[key];let steps=item.steps.concat(state.duration>=30?['Spend a few more minutes making a small example or writing down what you learned.']:[]).concat(state.duration>=60?['Go deeper: create a shareable example, take a beginner tutorial, or ask someone for feedback.']:[]);

function renderSpanish(){let idx=Number.isInteger(state.spanishIndex)?Math.max(0,Math.min(spanish.length-1,state.spanishIndex)):0,l=spanish[idx],flip=flashFlip,wi=(state.spanishQuiz.flashIndex||0)%l.words.length,word=l.words[wi];let wrong=l.words.filter((w,i)=>i!==wi).slice(0,3).map(w=>w[1]);let choices=[word[1],...wrong].sort((a,b)=>{let hash=s=>[...s].reduce((t,ch)=>t+ch.charCodeAt(0),0);return (hash(a)+wi*13)%7-(hash(b)+wi*13)%7});let quizstate=state.spanishQuiz[idx+'_'+wi];return '<div class="intro"><span class="eyebrow muted">HOLA, FUTURE TRAVELLER</span><h1 style="margin-top:8px">Tu aventura empieza aquí 🇪🇸</h1><p>Your Spanish adventure starts here. Learn a little today, use it in the world tomorrow.</p></div><div class="grid three"><div class="card metric"><span class="eyebrow muted">Lessons finished</span><div class="num">'+state.spanishDone.length+' / '+spanish.length+'</div><div class="progress"><div style="width:'+(state.spanishDone.length/spanish.length*100)+'%"></div></div></div><div class="card metric"><span class="eyebrow muted">Words in the course</span><div class="num">'+spanish.length*5+'</div><small>Learn at your own pace</small></div><div class="card metric"><span class="eyebrow muted">What matters</span><div class="num" style="font-size:23px">Confidence</div><small>Not a perfect streak</small></div></div><div class="grid two" style="margin-top:18px"><div class="card"><div class="card-top"><div><span class="eyebrow muted">LESSON '+(idx+1)+' OF '+spanish.length+'</span><h2 style="margin:7px 0 12px">'+esc(l.title)+'</h2></div><span class="capsule">5 new words</span></div><select class="field" onchange="pickSpanishLesson(Number(this.value))">'+spanish.map((a,i)=>'<option value="'+i+'" '+(i===idx?'selected':'')+'>'+(state.spanishDone.includes(i)?'✓ ':'')+(i+1)+'. '+esc(a.title)+'</option>').join('')+'</select><p class="small muted" style="margin:17px 0 10px">Tap the card to reveal the translation.</p><div class="flashcard" onclick="flipCard()"><span class="eyebrow muted">'+(flip?'ENGLISH':'ESPAÑOL')+'</span><h2>'+esc(flip?word[1]:word[0])+'</h2><span class="small muted">Tap to flip ↻</span></div><div class="flex between" style="margin:12px 0 18px"><button class="btn light" onclick="prevFlash()">← Previous</button><span class="small muted">'+(wi+1)+' / '+l.words.length+'</span><button class="btn light" onclick="nextFlash()">Next →</button></div><div class="soft"><span class="eyebrow muted">PHRASE OF THE LESSON</span><h3 style="margin-top:7px">'+esc(l.phrase[0])+'</h3><p class="muted">'+esc(l.phrase[1])+'</p><button class="btn light small spanish-phrase-listen" onclick="speakSpanishPhrase('+idx+')">🔊 Hear the full phrase</button></div><button class="btn" style="margin-top:17px;width:100%" onclick="completeSpanish()">'+(state.spanishDone.includes(idx)?'✓ Lesson completed':'✓ Complete this lesson')+'</button></div><div class="grid"><div class="card"><span class="eyebrow muted">CHECK YOUR MEMORY</span><h3 style="margin:7px 0 14px">What does “'+esc(word[0])+'” mean?</h3><div class="grid" style="gap:7px">'+choices.map(c=>'<button class="answer '+(quizstate===c?(c===word[1]?'good':'bad'):'')+'" onclick="answerQuiz('+idx+','+wi+',\''+esc(c).replaceAll('&#39;','\\\'')+'\')">'+esc(c)+(quizstate===c?(c===word[1]?' ✓':' · Try again'):'')+'</button>').join('')+'</div><p class="note" style="margin-top:13px">Try choosing the meaning before flipping your flashcard.</p></div><div class="card"><span class="eyebrow muted">PRONUNCIATION PRACTICE</span><h3 style="margin-top:8px">Listen to every word 🔊</h3><p class="muted small">Tap Listen beside any Spanish word. Replay it as often as you need, then try saying it aloud.</p><label class="spanish-playback-select"><span class="small muted">Listening speed</span><select class="field" aria-label="Spanish pronunciation playback speed" onchange="setSpanishRate(this.value)">'+[[0.65,'Extra slow'],[0.8,'Slow'],[1,'Normal']].map(a=>'<option value="'+a[0]+'" '+((Number(state.spanishRate)||0.8)===a[0]?'selected':'')+'>'+a[1]+'</option>').join('')+'</select></label><div class="spanish-word-list">'+l.words.map((w,i)=>'<div class="spanish-word-row"><div><strong>'+esc(w[0])+'</strong><span class="small muted">'+esc(w[1])+'</span></div><button class="btn sage" type="button" aria-label="Listen to '+esc(w[0])+'" onclick="speakSpanishWord('+idx+','+i+')">🔊 Listen</button></div>').join('')+'</div><div class="spanish-audio-actions"><button class="btn" type="button" onclick="speakSpanishAll('+idx+')">▶ Listen to all 5</button><button class="btn light" type="button" onclick="stopSpanishSpeech()">■ Stop</button></div><p class="note" style="margin-top:12px">Pronunciations use your device’s Spanish voice when available. The full phrase above has its own Listen button too.</p></div><div class="card" style="background:#f2eee2"><span class="eyebrow muted">TRAVEL MOTIVATION</span><p class="quote" style="margin-top:8px">Every new word is one more door you can open. 🌎</p></div></div></div>'}
function pickSpanishLesson(i){state.spanishIndex=i;state.spanishQuiz.flashIndex=0;flashFlip=false;save();drawPage()}
function flipCard(){flashFlip=!flashFlip;drawPage()}
function nextFlash(){let l=spanish[state.spanishIndex];state.spanishQuiz.flashIndex=((state.spanishQuiz.flashIndex||0)+1)%l.words.length;flashFlip=false;save();drawPage()}
function prevFlash(){let l=spanish[state.spanishIndex];state.spanishQuiz.flashIndex=((state.spanishQuiz.flashIndex||0)+l.words.length-1)%l.words.length;flashFlip=false;save();drawPage()}
function answerQuiz(idx,wi,answer){state.spanishQuiz[idx+'_'+wi]=answer;save();drawPage();if(spanish[idx].words[wi][1]===answer)toast('¡Muy bien! Correct 🎉')}
function completeSpanish(){let i=state.spanishIndex;if(!state.spanishDone.includes(i))state.spanishDone.push(i);if(i<spanish.length-1)state.spanishIndex=i+1;state.spanishQuiz.flashIndex=0;flashFlip=false;save();drawPage();toast('¡Excelente! Lesson finished 🇪🇸')}
function setSpanishRate(value){let n=Number(value);state.spanishRate=[0.65,0.8,1].includes(n)?n:0.8;save();drawPage()}
function spanishAudioSupported(){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){toast('Spanish audio is not supported in this browser. Please try Safari.');return false}return true}
function spanishUtterance(text){let spoken=String(text).replace(/\/a\b/g,'');let u=new SpeechSynthesisUtterance(spoken);u.lang='es-ES';u.rate=Number(state.spanishRate)||0.8;u.pitch=1;let voices=window.speechSynthesis.getVoices();let spanishVoice=voices.find(v=>v.lang.toLowerCase()==='es-es')||voices.find(v=>v.lang.toLowerCase().startsWith('es'));if(spanishVoice)u.voice=spanishVoice;u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast('Unable to play audio. Check your device volume and speech voices.')};return u}
function playSpanishTexts(texts){if(!spanishAudioSupported())return;let speaker=window.speechSynthesis;speaker.cancel();for(let text of texts)speaker.speak(spanishUtterance(text));if(speaker.paused)speaker.resume()}
function speakSpanishWord(lessonIndex,wordIndex){let l=spanish[lessonIndex];if(l&&l.words[wordIndex])playSpanishTexts([l.words[wordIndex][0]])}
function speakSpanishPhrase(lessonIndex){let l=spanish[lessonIndex];if(l)playSpanishTexts([l.phrase[0]])}
function speakSpanishAll(lessonIndex){let l=spanish[lessonIndex];if(l)playSpanishTexts(l.words.map(w=>w[0]))}
function stopSpanishSpeech(){if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function speakSpanish(){let l=spanish[state.spanishIndex],i=(state.spanishQuiz.flashIndex||0)%l.words.length;speakSpanishWord(state.spanishIndex,i)}
const milestones=[['Discover your direction','Try at least 3 different skill paths, and rate them.'],['Identify an actual problem','Write down a specific problem and who experiences it.'],['Build a simple example','Create one working prototype or useful service sample.'],['Talk to potential customers','Get feedback from at least 3 people who face the problem.'],['Test a paid pilot','Offer a small solution without promising unrealistic outcomes.'],['Build repeatability','Document delivery, costs and time needed.'],['Create a freedom fund','Start building savings, an emergency buffer, and a travel plan.'],['Plan remote readiness','Check income stability, client obligations and work-from-abroad constraints.']];
function milestoneProgress(){return Math.round(state.milestones.length/milestones.length*100)}
function renderFreedom(){let total=state.income.reduce((s,x)=>s+Number(x.amount||0),0);return '<div class="intro"><span class="eyebrow muted">FROM HERE TO ANYWHERE</span><h1 style="margin-top:8px">Your freedom roadmap ✈️</h1><p>Build an online income stream thoughtfully while keeping the stability of your current work.</p></div><div class="hero" style="min-height:180px"><div style="z-index:2"><span class="eyebrow" style="color:#c4dbc7">THE BIG DREAM</span><h1 style="font-size:32px">Make a living from anywhere.</h1><p>Learn → Build → Test → Earn → Travel</p></div><div class="hero-ornament">🌴</div></div><div class="grid three"><div class="card metric"><span class="eyebrow muted">Roadmap progress</span><div class="num">'+milestoneProgress()+'%</div><div class="progress"><div style="width:'+milestoneProgress()+'%"></div></div></div><div class="card metric"><span class="eyebrow muted">Ideas explored</span><div class="num">'+state.ideas.length+'</div><small>Keep testing assumptions</small></div><div class="card metric"><span class="eyebrow muted">Online income logged</span><div class="num" style="font-size:26px">$'+total.toLocaleString(undefined,{maximumFractionDigits:2})+'</div><small>Manual tracking · currency as entered</small></div></div><div class="grid two" style="margin-top:18px"><div class="card"><div class="card-top"><h2>Your freedom steps</h2><span class="capsule">No fixed deadlines</span></div><p class="muted small" style="margin:0 0 14px">Check off steps when you’ve actually done them.</p>'+milestones.map(([title,desc],i)=>'<div class="path '+(state.milestones.includes(i)?'done':'')+'"><div class="step">'+(state.milestones.includes(i)?'✓':i+1)+'</div><div style="flex:1"><strong>'+esc(title)+'</strong><p>'+esc(desc)+'</p></div><input aria-label="Complete step '+(i+1)+'" type="checkbox" '+(state.milestones.includes(i)?'checked':'')+' onchange="toggleMilestone('+i+')"/></div>').join('')+'</div><div class="grid"><div class="card"><div class="card-top"><h3>Business idea notebook</h3><button class="btn small" onclick="addIdea()">+ Add idea</button></div><p class="muted small">Capture possibilities without committing to them.</p>'+(state.ideas.length?state.ideas.map(i=>'<div class="rowline"><div class="flex between"><strong>'+esc(i.title)+'</strong><button class="tinybtn" onclick="removeIdea(\''+i.id+'\')">Remove</button></div><p class="small muted">'+esc(i.notes||'')+'</p></div>').join(''):'<div class="empty" style="margin-top:15px">Your next idea might start with a problem you already understand.</div>')+'</div><div class="card"><div class="card-top"><h3>Online income log</h3><button class="btn small" onclick="addIncome()">+ Log income</button></div><p class="muted small">Track what you actually earn from online work.</p>'+(state.income.length?state.income.slice(-6).reverse().map(x=>'<div class="rowline flex between"><div><b>'+esc(x.source)+'</b><p class="small muted">'+esc(x.date)+'</p></div><strong>$'+Number(x.amount).toFixed(2)+'</strong></div>').join(''):'<div class="empty" style="margin-top:15px">Your first $1 online belongs here. No rush.</div>')+'</div><div class="card" style="background:#e8ede3"><h3>Before you leave your job...</h3><p class="muted">Aim for income you can rely on, an emergency buffer, clarity on taxes and travel visas, and evidence that clients will keep paying. It’s a long-term direction, not a promise or deadline.</p></div></div></div>'}
function toggleMilestone(i){state.milestones=state.milestones.includes(i)?state.milestones.filter(n=>n!==i):[...state.milestones,i];save();drawPage()}
function addIdea(){modalForm('Add a business idea','<div class="form-field"><label>Idea</label><input name="title" class="field" required maxlength="100" placeholder="e.g. Crew scheduling tool"/></div><div class="form-field"><label>What problem does it solve?</label><textarea name="notes" class="field" rows="4" maxlength="700"></textarea></div>','Save idea',fd=>{state.ideas.push({id:uid(),title:fd.get('title'),notes:fd.get('notes')});save();closeModal();drawPage()})}
function removeIdea(id){if(!confirm('Remove this idea?'))return;state.ideas=state.ideas.filter(i=>i.id!==id);save();drawPage()}
function addIncome(){modalForm('Log online income','<div class="form-field"><label>Amount (use one currency consistently)</label><input class="field" name="amount" type="number" min="0.01" step="0.01" required/></div><div class="form-field"><label>Source</label><input class="field" maxlength="70" name="source" required placeholder="e.g. Website project"/></div>','Save income',fd=>{state.income.push({id:uid(),date:dayKey(),amount:Number(fd.get('amount')),source:fd.get('source')});save();closeModal();drawPage();toast('Income entry saved')})}
function renderGrowth(){let daylog=state.journal[dayKey()]||'';let hist=Object.entries(state.journal).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);return '<div class="intro"><span class="eyebrow muted">ONE DAY AT A TIME</span><h1 style="margin-top:8px">Your personal growth 🌱</h1><p>Habits, gentle check-ins, and little wins. Nothing here needs to be perfect.</p></div><div class="grid two"><div class="card"><div class="card-top"><h2>Your daily habits</h2><button class="btn small" onclick="addHabit()">+ Add habit</button></div><p class="muted small" style="margin-bottom:12px">Choose only habits you actually want to keep.</p>'+state.habits.map(h=>'<div class="rowline flex between"><label class="check"><input type="checkbox" '+((state.habitLogs[dayKey()]||[]).includes(h.id)?'checked':'')+' onchange="toggleHabit(\''+h.id+'\')"/>'+esc(h.emoji)+' '+esc(h.name)+'</label><button class="tinybtn" onclick="removeHabit(\''+h.id+'\')">Remove</button></div>').join('')+'</div><div class="card"><span class="eyebrow muted">DAILY CHECK-IN</span><h2 style="margin:8px 0 17px">How are you doing?</h2>'+moodMarkup()+'<div class="soft" style="margin-top:17px"><p class="small muted">Tracking your mood can help you recognize patterns, but there are no grades or scores for having a hard day.</p></div></div><div class="card"><div class="card-top"><h2>Today’s journal</h2><span class="capsule">Private to this browser</span></div><p class="muted" style="margin:8px 0">What’s one thing you’re proud of, grateful for, or looking forward to?</p><textarea id="journalInput" class="field" rows="6" maxlength="4000" placeholder="Write anything that’s on your mind...">'+esc(daylog)+'</textarea><button class="btn" style="margin-top:11px" onclick="saveJournal()">Save reflection</button></div><div class="card"><h2>Little moments worth keeping</h2><p class="muted small" style="margin:8px 0 13px">Recent journal entries</p>'+(hist.length?hist.map(([date,entry])=>'<div class="rowline"><b class="small">'+esc(date)+'</b><p class="small muted">'+esc(entry.slice(0,170))+(entry.length>170?'…':'')+'</p></div>').join(''):'<div class="empty">Your reflections will appear here.</div>')+'</div></div>'}
function saveJournal(){let v=document.getElementById('journalInput').value.trim();if(v)state.journal[dayKey()]=v;else delete state.journal[dayKey()];save();drawPage();toast('Your reflection has been saved')}
function addHabit(){modalForm('Create a habit','<div class="form-field"><label>Habit name</label><input name="name" maxlength="65" required class="field" placeholder="e.g. 10-minute reading"/></div><div class="form-field"><label>Emoji</label><input name="emoji" maxlength="8" class="field" value="🌷"/></div>','Add habit',fd=>{state.habits.push({id:uid(),name:fd.get('name'),emoji:fd.get('emoji')||'✦'});save();closeModal();drawPage()})}
function removeHabit(id){if(!confirm('Remove this habit? Previous check-ins will remain in your backup.'))return;state.habits=state.habits.filter(h=>h.id!==id);save();drawPage()}
function renderSettings(){return '<div class="intro"><span class="eyebrow muted">MAKE IT YOURS</span><h1 style="margin-top:8px">Settings & backups ⚙️</h1><p>Set your name, adjust your challenge time, and safely keep a copy of your progress.</p></div><div class="grid two"><div class="card"><h2>Your preferences</h2><div class="form-field"><label>Your first name (optional)</label><input class="field" id="prefName" maxlength="40" value="'+esc(state.name)+'" placeholder="What should the app call you?"/></div><button class="btn" onclick="savePref()">Save preferences</button></div><div class="card"><h2>Your data</h2><p class="muted" style="margin:10px 0">Your goals, journals and progress are saved only in this browser on this device. They are not synced between devices or uploaded to a server.</p><div class="flex wrap" style="margin:13px 0"><button class="btn" onclick="exportData()">↓ Export backup</button><label class="btn light" style="cursor:pointer">↑ Restore backup<input type="file" accept="application/json,.json" hidden onchange="importData(this)"/></label></div><p class="note">Export regularly before clearing browser data or changing phones. A backup may contain private journal entries.</p></div><div class="card"><h3>Make it feel like an app</h3><p class="muted">When opened from an HTTPS website in Safari, tap Share → Add to Home Screen. A local file opened in Files may not support all features or permanent storage.</p></div><div class="card"><h3>Fresh start</h3><p class="muted">If you ever want to reset your data, export a backup first.</p><button class="btn light" style="margin-top:13px;color:#a35448" onclick="resetData()">Reset this browser’s data</button></div></div>'}
function savePref(){state.name=document.getElementById('prefName').value.trim();save();drawPage();toast('Preferences saved')}
function exportData(){let blob=new Blob([JSON.stringify({app:'My Next Chapter',version:1,exported:new Date().toISOString(),data:state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-next-chapter-backup-'+dayKey()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Backup created')}
async function importData(inp){let f=inp.files?.[0];if(!f)return;try{if(f.size>4e6)throw Error('File is too large');let parsed=JSON.parse(await f.text());if(parsed.app!=='My Next Chapter'||!parsed.data||!Array.isArray(parsed.data.goals))throw Error('Not a valid My Next Chapter backup');if(!confirm('Replace all progress in this browser with the backup?'))return;state=Object.assign(initial(),parsed.data);save();drawPage();toast('Your backup was restored')}catch(e){toast('Could not import: '+e.message)}}
function resetData(){if(!confirm('This will erase your saved data on this device. Have you exported a backup?'))return;if(!confirm('Really erase everything and start fresh?'))return;state=initial();save();drawPage();toast('A fresh chapter begins')}
function drawPage(){nav();document.getElementById('todayLabel').textContent='✦ '+new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});let renders={home:renderHome,vision:renderVision,learn:renderLearn,spanish:renderSpanish,freedom:renderFreedom,growth:renderGrowth,settings:renderSettings};document.getElementById('page-'+currentPage).innerHTML=renders[currentPage]()}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update().catch(()=>{})).catch(()=>{}));
drawPage();
